[package]
name = "dqsdv2"
version = "1.1.0"
edition = "2021"
authors = ["Daniel J. Dillberg <BigDilly95@gmail.com>"]
license = "MIT"
description = "DVSM-pi+++ / DQSDv2 - Deterministic Spectral Arbitration Kernel"
repository = "https://github.com/djdillberg/dvsm-pi-plus"

[lib]
name = "dqsdv2"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "dqsdv2"
path = "src/main.rs"

[features]
default = ["std"]
std = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
